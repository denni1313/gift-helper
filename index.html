<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#07102a">
<title>Ajudante de Presentes</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%81%3C/text%3E%3C/svg%3E">
<style>html, body { margin: 0; height: 100%; background: #07102a; }</style>
<script>
  // Каждый заход открывает приложение по новому адресу (?t=...),
  // поэтому браузер не может подсунуть старую версию из кеша.
  location.replace("app.html?t=" + Date.now());
</script>
</head>
